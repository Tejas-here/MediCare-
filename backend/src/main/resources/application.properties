# ===================================================================
# MediCare+ Spring Boot Application Configuration
# ===================================================================

server.port=8080

# Application name
spring.application.name=medicare-backend

# -------------------------------------------------------------------
# MySQL Relational Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/medicare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:TEJ@s077}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Serialization
spring.jackson.serialization.fail-on-empty-beans=false

# -------------------------------------------------------------------
# File Upload Configuration (Reports, documents, images)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
medicare.upload.dir=uploads

# Static resource handling (Serves Medicare+ frontend pages)
spring.web.resources.static-locations=classpath:/static/,file:uploads/
