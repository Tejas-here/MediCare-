# ===================================================================
# MediCare+ Dev / Embedded SQL (H2) Profile Configuration
# ===================================================================

server.port=8080
spring.application.name=medicare-backend

spring.datasource.url=jdbc:h2:file:./data/medicare_h2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
medicare.upload.dir=uploads
spring.web.resources.static-locations=classpath:/static/,file:uploads/
