<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>
        MediCare+ | Login
    </title>
    <link href="style.css" rel="stylesheet" />
</head>

<body data-page="login">
    <div class="login-wrap">
        <section class="login-info">
            <a class="logo" href="index.html">
                <span class="mark">
      &hearts;
     </span> MediCare
                <em>
      +
     </em>
            </a>
            <h1>
                Your Health.
                <br/>
                <span style="color:var(--b)">
      Our Priority.
     </span>
            </h1>
            <p>
                A simple place to organize your medical reports, medicine schedule and communication with your care team.
            </p>

        </section>
        <section class="login-card">
            <a class="logo" href="index.html">
                <span class="mark">
      &hearts;
     </span> MediCare
                <em>
      +
     </em>
            </a>
            <h2 id="ltitle">
                Login to your account
            </h2>
            <p class="muted">
                Welcome back. Please enter your details.
            </p>
            <form id="loginForm">
                <label class="field">
      Patient Id
      <input name="Patient Id" placeholder="abc11" required=""/>
     </label>
                <label class="field">
      Email / Phone Number
      <input name="email" placeholder="you@example.com" required=""/>
     </label>
                <label class="field">
      Password
      <input minlength="3" name="password" placeholder="Enter any demo password" required="" type="password"/>
     </label>
                <div class="login-links">
                    <a href="#" id="forgot">
       Forgot password?
      </a>
                    <a href="signin.html" id="signup">
       Create account
      </a>
                </div>
                <button class="btn full" type="submit">
      Login &rarr;
     </button>
            </form>

            <a class="muted" href="index.html">
     &larr; Back to home
    </a>
        </section>
    </div>
    <script src="app.js" defer></script>
</body>

</html>
